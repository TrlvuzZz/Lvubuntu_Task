<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm tra độ mạnh mật khẩu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        #result {
            margin-top: 20px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Kiểm tra mật khẩu</h2>

    <input
        type="password"
        id="password"
        placeholder="Nhập mật khẩu"
    >

    <button onclick="checkPassword()">
        Kiểm tra
    </button>

    <div id="result"></div>

</div>

<script>
function checkPassword() {

    const password =
        document.getElementById("password").value;

    if (password === "") {
        document.getElementById("result").innerHTML =
            "Vui lòng nhập mật khẩu.";
        return;
    }

    fetch(
        "/api/check-password?password=" +
        encodeURIComponent(password)
    )
    .then(response => response.json())
    .then(data => {

        document.getElementById("result").innerHTML =
            "<b>Điểm:</b> " + data.score +
            "/5<br>" +
            "<b>Độ mạnh:</b> " + data.level +
            "<br>" +
            data.message;

    })
    .catch(error => {

        document.getElementById("result").innerHTML =
            "Không thể kết nối tới API.";

        console.error(error);
    });
}
</script>

</body>
</html>
