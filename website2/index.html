<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài Xỉu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #181818;
            color: white;
            text-align: center;
            padding-top: 50px;
        }

        .game {
            width: 400px;
            margin: auto;
            padding: 30px;
            background: #292929;
            border-radius: 20px;
        }

        .dice {
            font-size: 70px;
            margin: 25px 0;
        }

        button {
            padding: 12px 25px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .tai {
            background: #e74c3c;
            color: white;
        }

        .xiu {
            background: #3498db;
            color: white;
        }

        .lac {
            background: #f1c40f;
            color: #111;
        }

        .selected {
            outline: 4px solid white;
        }

        #ketqua {
            font-size: 22px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="game">
    <h1>🎲 TÀI XỈU 🎲</h1>

    <p>Chọn Tài hoặc Xỉu</p>

    <button id="tai" class="tai" onclick="chon('Tài')">
        TÀI
    </button>

    <button id="xiu" class="xiu" onclick="chon('Xỉu')">
        XỈU
    </button>

    <div class="dice" id="xucxac">
        ⚀ ⚀ ⚀
    </div>

    <button class="lac" onclick="lacXucXac()">
        LẮC XÚC XẮC
    </button>

    <div id="ketqua">Chưa có kết quả</div>
</div>

<script>
    let luaChon = "";

    const matXucXac = [
        "⚀", "⚁", "⚂", "⚃", "⚄", "⚅"
    ];

    function chon(loai) {
        luaChon = loai;

        document.getElementById("tai").classList.remove("selected");
        document.getElementById("xiu").classList.remove("selected");

        if (loai === "Tài") {
            document.getElementById("tai").classList.add("selected");
        } else {
            document.getElementById("xiu").classList.add("selected");
        }

        document.getElementById("ketqua").innerHTML =
            "Bạn đã chọn: <b>" + loai + "</b>";
    }

    function lacXucXac() {

        if (luaChon === "") {
            alert("Chọn Tài hoặc Xỉu trước!");
            return;
        }

        let x1 = Math.floor(Math.random() * 6) + 1;
        let x2 = Math.floor(Math.random() * 6) + 1;
        let x3 = Math.floor(Math.random() * 6) + 1;

        let tong = x1 + x2 + x3;

        document.getElementById("xucxac").innerHTML =
            matXucXac[x1 - 1] + " " +
            matXucXac[x2 - 1] + " " +
            matXucXac[x3 - 1];

        // Bản đơn giản:
        // 4-10 = Xỉu
        // 11-17 = Tài
        // Bộ ba xử lý riêng

        let ketQua;

        if (x1 === x2 && x2 === x3) {
            ketQua = "Bộ ba";
        } else if (tong >= 11) {
            ketQua = "Tài";
        } else {
            ketQua = "Xỉu";
        }

        let thongBao =
            "Tổng: <b>" + tong + "</b><br>" +
            "Kết quả: <b>" + ketQua + "</b><br>";

        if (ketQua === luaChon) {
            thongBao += "🎉 Bạn đoán đúng!";
        } else {
            thongBao += "😢 Bạn đoán sai!";
        }

        document.getElementById("ketqua").innerHTML = thongBao;
    }
</script>

</body>
</html>
