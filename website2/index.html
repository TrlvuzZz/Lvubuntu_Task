<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kiểm tra độ mạnh mật khẩu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        .box {
            width: 420px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        .description {
            text-align: center;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .password-box {
            position: relative;
            margin-bottom: 15px;
        }

        #password {
            width: 100%;
            padding: 12px 70px 12px 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }

        #password:focus {
            border-color: #555;
        }

        .toggle-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
            padding: 6px 8px;
        }

        .check-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            line-height: 1.8;
        }

        .note {
            margin-top: 20px;
            font-size: 13px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Kiểm tra độ mạnh mật khẩu</h2>

    <div class="description">
        Nhập mật khẩu để kiểm tra mức độ bảo mật
    </div>

    <div class="password-box">

        <input
            type="password"
            id="password"
            placeholder="Nhập mật khẩu"
        >

        <button
            type="button"
            class="toggle-password"
            onclick="togglePassword()"
        >
            Hiện
        </button>

    </div>

    <button
        class="check-button"
        onclick="checkPassword()"
    >
        Kiểm tra
    </button>

    <div id="result"></div>

    <div class="note">
        Mật khẩu được đánh giá dựa trên 5 tiêu chí:
        độ dài, chữ hoa, chữ thường, chữ số và ký tự đặc biệt.
    </div>

</div>

<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    const button =
        document.querySelector(".toggle-password");

    if (password.type === "password") {

        password.type = "text";
        button.textContent = "Ẩn";

    } else {

        password.type = "password";
        button.textContent = "Hiện";

    }
}


async function checkPassword() {

    const password =
        document.getElementById("password").value;

    const result =
        document.getElementById("result");


    if (password === "") {

        result.style.display = "block";

        result.innerHTML =
            "Vui lòng nhập mật khẩu.";

        return;
    }


    result.style.display = "block";
    result.innerHTML = "Đang kiểm tra...";


    try {

        const response = await fetch(
            "/api/check-password?password=" +
            encodeURIComponent(password)
        );


        if (!response.ok) {
            throw new Error("API không phản hồi");
        }


        const data = await response.json();


        result.innerHTML =
            "<b>Điểm:</b> " +
            data.score +
            "/5<br>" +

            "<b>Độ mạnh:</b> " +
            data.level +
            "<br>" +

            "<b>Đánh giá:</b> " +
            data.message;


    } catch (error) {

        result.innerHTML =
            "Không thể kết nối tới API.";

    }
}


/* Nhấn Enter cũng có thể kiểm tra */

document
    .getElementById("password")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            checkPassword();
        }

    });

</script>

</body>
</html>
