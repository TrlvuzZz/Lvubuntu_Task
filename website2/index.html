<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm tra độ mạnh mật khẩu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 360px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            width: 100%;
            padding: 12px 45px 12px 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            user-select: none;
            font-size: 18px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        #result {
            margin-top: 20px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Kiểm tra độ mạnh mật khẩu</h2>

    <div class="password-box">

        <input
            type="password"
            id="password"
            placeholder="Nhập mật khẩu"
        >

        <span
            class="show-password"
            onclick="showPassword()"
            id="eye"
        >
            👁
        </span>

    </div>

    <button onclick="checkPassword()">
        Kiểm tra
    </button>

    <div id="result"></div>

</div>

<script>

    // Hiện / ẩn mật khẩu
    function showPassword() {

        const input = document.getElementById("password");
        const eye = document.getElementById("eye");

        if (input.type === "password") {

            input.type = "text";
            eye.innerHTML = "🙈";

        } else {

            input.type = "password";
            eye.innerHTML = "👁";

        }
    }


    // Gọi API Node-RED
    function checkPassword() {

        const password =
            document.getElementById("password").value;

        const result =
            document.getElementById("result");

        if (password === "") {

            result.innerHTML =
                "Vui lòng nhập mật khẩu.";

            return;
        }

        fetch(
            "/api/check-password?password=" +
            encodeURIComponent(password)
        )

        .then(response => response.json())

        .then(data => {

            result.innerHTML =
                "<b>Điểm:</b> " + data.score + "/5" +
                "<br>" +
                "<b>Độ mạnh:</b> " + data.level +
                "<br>" +
                "<b>Đánh giá:</b> " + data.message;

        })

        .catch(error => {

            result.innerHTML =
                "Không thể kết nối tới API.";

            console.error(error);
        });
    }

</script>

</body>
</html>
